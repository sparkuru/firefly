name: firefly

x-memos-runtime: &memos-runtime
  profiles: [memos]
  build:
    context: .
    dockerfile: services/memos/Dockerfile
  image: firefly-memos:local
  init: true
  depends_on:
    web:
      condition: service_started
  network_mode: service:web
  restart: unless-stopped
  stop_grace_period: 200s
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "${MEMOS_RUNTIME_USER:-1000:1000}"
  environment:
    NODE_ENV: production
    MEMOS_BIND: 127.0.0.1
    MEMOS_PORT: 8788
    MEMOS_TRUST_PROXY: loopback
    MEMOS_CONFIG_PATH: config/plugins/memos/config.toml
    MEMOS_SECRETS_FILE: /run/secrets/memos.env
  volumes:
    - type: bind
      source: ${MEMOS_DATA_ROOT:-./plugins/memos/data}
      target: /var/lib/firefly-memos
      bind:
        create_host_path: false
    - type: bind
      source: ${MEMOS_CONFIG_ROOT:-./config/plugins/memos}/config.toml
      target: /app/config/plugins/memos/config.toml
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${MEMOS_CONFIG_ROOT:-./config/plugins/memos}/secrets.env
      target: /run/secrets/memos.env
      read_only: true
      bind:
        create_host_path: false

services:
  memos:
    <<: *memos-runtime

  memos-worker:
    <<: *memos-runtime
    command: [dist/src/worker-server.js]
    healthcheck:
      test: [CMD, node, dist/src/worker-health.js]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: firefly:local
    init: true
    ports:
      - "127.0.0.1:${FIREFLY_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  comments:
    profiles:
      - comments
    build:
      context: .
      dockerfile: services/comments/Dockerfile
    image: firefly-comments:local
    init: true
    depends_on:
      web:
        condition: service_started
    # The proxy and comments process share a private network namespace. The
    # comments listener is therefore reachable by Nginx at loopback but never
    # receives a host-published port.
    network_mode: service:web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "node"
    environment:
      NODE_ENV: production
      COMMENTS_BIND: 127.0.0.1
      COMMENTS_PORT: 8787
      COMMENTS_DATABASE_PATH: /var/lib/firefly-comments/core.db
      COMMENTS_CONFIG_PATH: /app/config/plugins/comments/config.toml
      COMMENTS_SECRETS_FILE: /run/secrets/comments.env
    volumes:
      - ${COMMENTS_DATA_ROOT:-./plugins/comments/data}:/var/lib/firefly-comments
      - ${COMMENTS_PLUGIN_ROOT:-./plugins/comments}/config.toml:/app/config/plugins/comments/config.toml:ro
      - ${COMMENTS_PLUGIN_ROOT:-./plugins/comments}/secrets.env:/run/secrets/comments.env:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
