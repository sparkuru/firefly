name: f1refly

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: f1refly:local
    init: true
    ports:
      - "127.0.0.1:${F1REFLY_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
