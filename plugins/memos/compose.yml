name: firefly-memos

# Operator-owned same-host edge; align owner-only mount UID:GID before startup.
x-runtime: &runtime
  image: ${MEMOS_IMAGE:-firefly-memos:local}
  init: true
  network_mode: host
  restart: unless-stopped
  stop_grace_period: 200s
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "${MEMOS_RUNTIME_USER:?MEMOS_RUNTIME_USER must be set to the owner UID:GID}"
  environment:
    NODE_ENV: production
    MEMOS_BIND: 127.0.0.1
    MEMOS_PORT: 8788
    MEMOS_TRUST_PROXY: loopback
    MEMOS_CONFIG_PATH: config/plugins/memos/config.toml
    MEMOS_SECRETS_FILE: /run/secrets/memos.env
  volumes:
    - type: bind
      source: ${MEMOS_DATA_ROOT:-./data}
      target: /var/lib/firefly-memos
      bind:
        create_host_path: false
    - type: bind
      source: ${MEMOS_CONFIG_ROOT:-.}/config.toml
      target: /app/config/plugins/memos/config.toml
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${MEMOS_CONFIG_ROOT:-.}/secrets.env
      target: /run/secrets/memos.env
      read_only: true
      bind:
        create_host_path: false

services:
  memos:
    <<: *runtime
  memos-worker:
    <<: *runtime
    command: [dist/src/worker-server.js]
    healthcheck:
      test: [CMD, node, dist/src/worker-health.js]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
