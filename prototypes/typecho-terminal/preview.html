<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070b09">
    <title>Terminal Theme Preview</title>
    <link rel="stylesheet" href="terminal/assets/terminal.css">
</head>
<body data-page-kind="index">
<main class="terminal-stage">
    <section class="terminal-window" aria-label="Interactive blog terminal">
        <header class="terminal-titlebar">
            <div class="terminal-lights" aria-hidden="true"><span></span><span></span><span></span></div>
            <a class="terminal-title" href="./preview.html">guest@majo:~/blog</a>
            <span class="terminal-status">SSH</span>
        </header>
        <div class="terminal-screen" id="terminal-screen">
            <section class="terminal-output" id="terminal-output" aria-live="polite"></section>
            <form class="terminal-command" id="terminal-command" autocomplete="off">
                <label class="terminal-prompt" for="terminal-input">
                    <span class="prompt-user">guest@majo</span><span class="prompt-separator">:</span><span class="prompt-path">~/blog</span><span class="prompt-symbol">$</span>
                </label>
                <input id="terminal-input" name="command" type="text" enterkeyhint="send" spellcheck="false" aria-label="Terminal command">
            </form>
        </div>
    </section>
</main>
