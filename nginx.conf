worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $uri $asset_cache_control {
        default "";
        ~^/_astro/ "public, max-age=31536000, immutable";
        ~^/fonts/JetBrainsMono-(Regular|Medium)-v2\.304\.woff2$ "public, max-age=31536000, immutable";
        ~^/lab/nerv/_astro/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;
        absolute_redirect off;

        add_header Cache-Control $asset_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /v1 {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            return 404 '{"ok":false,"error":"not_found","message":"not found."}';
        }

        # Same-device private comments route. The production edge must use
        # host-scoped server blocks; this container-local default only mirrors
        # the route for the opt-in Compose profile and fails closed when the
        # comments process is absent.
        location ^~ /v1/comments/ {
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:8787;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_intercept_errors off;
        }

        location ^~ /v1/ {
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            return 404 '{"ok":false,"error":"not_found","message":"not found."}';
        }

        location = /lab {
            return 301 /lab/;
        }

        location = /lab/nerv {
            return 301 /lab/nerv/;
        }

        location ^~ /lab/nerv/_astro/ {
            error_page 404 =404 /lab/nerv/404.html;
            try_files $uri =404;
        }

        location /lab/nerv/ {
            error_page 404 =404 /lab/nerv/404.html;
            try_files $uri $uri/ =404;
        }

        location = /404.html {
            try_files $uri =404;
        }

        location / {
            error_page 404 /404.html;
            try_files $uri $uri/ =404;
        }
    }
}
